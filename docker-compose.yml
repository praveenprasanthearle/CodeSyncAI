services:
  # ==========================================
  # 1. Persisted Database Service
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: codesync_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: codesync_ai
    volumes:
      - mongo_data:/data/db
    networks:
      - codesync_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. Express & Socket.IO Real-Time Backend
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: codesync_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      DATABASE_URL: mongodb://mongodb:27017/codesync_ai
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Run npm run setup or supply JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Run npm run setup or supply JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SECRET: ${COOKIE_SECRET:?Run npm run setup or supply COOKIE_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      EXECUTION_MODE: ${EXECUTION_MODE:-docker}
      DOCKER_HOST: ${DOCKER_HOST:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-codesync-runner:1}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - codesync_network

  # ==========================================
  # 3. High-Performance Nginx Frontend
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: codesync_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - codesync_network

volumes:
  mongo_data:
    driver: local

networks:
  codesync_network:
    driver: bridge
